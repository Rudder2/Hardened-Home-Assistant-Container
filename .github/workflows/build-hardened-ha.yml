name: Build Hardened Home Assistant Image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rudder2/hardened-home-assistant-container

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Compare local build against official upstream release
        id: check_version
        run: |
          UPSTREAM_DIGEST=$(docker manifest inspect homeassistant/home-assistant:stable | grep -m 1 "digest" | awk -F'"' '{print $4}')
          LOCAL_DIGEST=$(docker manifest inspect ghcr.io/rudder2/hardened-home-assistant-container:latest | grep -m 1 "digest" | awk -F'"' '{print $4}' || echo "none")

          if [ "$UPSTREAM_DIGEST" = "$LOCAL_DIGEST" ]; then
            echo "Infrastructure perfectly synchronized. No compilation required."
            echo "SHOULD_BUILD=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream release detected! Initiating compilation pipeline..."
            echo "SHOULD_BUILD=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx engine
        if: steps.check_version.outputs.SHOULD_BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with GitHub Container Registry
        if: steps.check_version.outputs.SHOULD_BUILD == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile and Publish Hardened Production Image
        if: steps.check_version.outputs.SHOULD_BUILD == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
